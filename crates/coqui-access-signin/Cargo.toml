[package]
name = "coqui-access-signin"
description = "Sign-in rules: which methods a sign-in may use from where it is made, and what it still needs"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
exclude = [".*", "*.local.*"]

[dependencies]
coqui-access.workspace = true
coqui-builder.workspace = true
coqui-net-acl.workspace = true
guatiao-builder.workspace = true

[features]
# The shared vectors every consumer of the policy runs.
test-support = []

[dev-dependencies]
coqui-access-signin = { path = ".", features = ["test-support"] }
guatiao-serde = { workspace = true, features = ["json"] }
serde_json.workspace = true
guatiao-builder.workspace = true
