[package]
name = "coqui-access-kit"
description = "Building blocks for access providers: typed tables, key and password hashing, generated secrets and private atomic files"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
exclude = [".*", "*.local.*"]

[dependencies]
argon2.workspace = true
coqui-access.workspace = true
data-encoding.workspace = true
getrandom.workspace = true
guatiao-serde = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
sha2.workspace = true
subtle.workspace = true

[features]
default = []
# Records kept in one private file, in any serde format the caller supplies: paths, change
# stamps, owner-only writes and `FileTable`.
file = ["dep:guatiao-serde", "dep:serde"]

[dev-dependencies]
guatiao-serde = { workspace = true, features = ["json"] }
serde_json.workspace = true
tempfile.workspace = true
toml.workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
