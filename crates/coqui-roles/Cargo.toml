[package]
name = "coqui-roles"
description = "First-match role authorizer with configurable scope kinds, built in code"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
exclude = [".*", "*.local.*"]

[dependencies]
coqui-access.workspace = true
serde = { workspace = true, optional = true }

[features]
# Serialize and Deserialize on the policy types, for whatever format a caller picks.
serde = ["dep:serde"]

[dev-dependencies]
toml.workspace = true
