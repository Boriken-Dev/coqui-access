[package]
name = "coqui-access-mtls"
description = "Map verified peer certificate fingerprints to directory identities, with account management"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
exclude = [".*", "*.local.*"]

[dependencies]
coqui-access.workspace = true
coqui-access-kit.workspace = true
coqui-peer.workspace = true
coqui-peer-tls = { workspace = true, features = ["ca"] }


[dev-dependencies]
coqui-peer-tls = { workspace = true, features = ["ca", "generate"] }
rcgen.workspace = true
tempfile.workspace = true
