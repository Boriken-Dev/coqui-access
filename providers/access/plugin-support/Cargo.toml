[package]
name = "coqui-access-plugin-support"
description = "What the access plugins share: the Guatiao source config and a file-backed table with a TOML codec"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# Not part of the shared library API: only the deployable plugins use it.
publish = false
exclude = [".*", "*.local.*"]

[dependencies]
coqui-access.workspace = true
coqui-access-kit = { workspace = true, features = ["file"] }
serde.workspace = true
toml.workspace = true

[dev-dependencies]
tempfile.workspace = true
