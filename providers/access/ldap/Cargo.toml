[package]
name = "coqui-access-ldap"
description = "Authenticate against LDAP or Active Directory and resolve names and groups from it"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
exclude = [".*", "*.local.*"]

[dependencies]
coqui-access.workspace = true
# The client TLS configuration for a directory with its own CA: TLS 1.2 and 1.3.
coqui-peer-tls = { workspace = true, features = ["tls12"] }
ldap3.workspace = true
rustls.workspace = true

[dev-dependencies]
rcgen.workspace = true
tempfile.workspace = true
