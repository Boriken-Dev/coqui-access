[package]
name = "coqui-access-key"
description = "Hashed bearer keys in any table: authenticator, directory and account management"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
exclude = [".*", "*.local.*"]

[dependencies]
coqui-access.workspace = true
coqui-access-kit.workspace = true
serde = { workspace = true, optional = true }

[features]
# Serialize and Deserialize on the record types, for whatever format a caller picks.
serde = ["dep:serde"]
