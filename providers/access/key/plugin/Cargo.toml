[package]
name = "coqui-access-key-plugin"
description = "coqui-access-key as a library a host loads"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
exclude = [".*", "*.local.*"]

# A cdylib and nothing else: it exports the Guatiao entry symbol, and anything that
# linked it as Rust would export that symbol as its own.
[lib]
crate-type = ["cdylib"]

[dependencies]
coqui-access.workspace = true
coqui-access-key = { path = ".." }
coqui-access-kit = { workspace = true, features = ["file"] }
# The formats a file source may be written in: this plugin's choice, not the libraries'.
serde.workspace = true
serde_json.workspace = true
toml.workspace = true

[dev-dependencies]
guatiao-serde = { workspace = true, features = ["json"] }
tempfile.workspace = true
