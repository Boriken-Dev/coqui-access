[package]
name = "coqui-access-peer"
description = "Map verified peer certificate fingerprints to directory identities, with account management"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
exclude = [".*", "*.local.*"]

[dependencies]
coqui-access.workspace = true
coqui-access-kit.workspace = true
coqui-peer-tls.workspace = true
serde = { workspace = true, optional = true }

[features]
# Serialize and Deserialize on the record types, for whatever format a caller picks.
serde = ["dep:serde"]

[dev-dependencies]
coqui-peer-tls = { workspace = true, features = ["generate"] }
