name: Test

# On demand: workflow_dispatch (optionally at a ref), or a pushed "ci-*" tag, which is
# throwaway and deleted after its run. Not run on every push.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to test (branch, tag, or SHA)"
        required: false
        default: ""
  workflow_call:
    inputs:
      ref:
        description: "Git ref to test (branch, tag, or SHA)"
        type: string
        required: false
        default: ""
  push:
    tags:
      - "ci-*"

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (${{ matrix.os }}, Rust ${{ matrix.toolchain }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        toolchain: [stable, "1.89"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      # coqui-access-system links the system's libpam.
      - run: sudo apt-get update && sudo apt-get install -y libpam0g-dev
        if: runner.os == 'Linux'
      - run: cargo fmt --all --check
        if: matrix.toolchain == 'stable'
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features
      - run: cargo doc --workspace --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  # The ignored real sign-in tests of coqui-access-system, against a throwaway account the job
  # makes and removes. Hosted runners are administrators (Windows) or have sudo (Linux).
  system-login:
    name: System sign-in (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, windows-11-arm]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libpam0g-dev
        if: runner.os == 'Linux'
      - name: Make a throwaway account (Windows)
        if: runner.os == 'Windows'
        # Windows PowerShell has the LocalAccounts module; `net user` stops to ask about a
        # password over 14 characters and, with no input, makes no account.
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $password = 'Cq1!' + [guid]::NewGuid().ToString('N')
          Write-Output "::add-mask::$password"
          $secret = ConvertTo-SecureString $password -AsPlainText -Force
          New-LocalUser -Name coquitest -Password $secret -AccountNeverExpires -PasswordNeverExpires | Out-Null
          New-LocalGroup -Name coquitestgroup | Out-Null
          Add-LocalGroupMember -Group coquitestgroup -Member coquitest
          if (-not (Get-LocalGroupMember -Group coquitestgroup | Where-Object Name -like '*\coquitest')) {
            throw 'the throwaway account is not in its group'
          }
          "COQUI_ACCESS_TEST_SYSTEM_USER=coquitest" >> $env:GITHUB_ENV
          "COQUI_ACCESS_TEST_SYSTEM_PASSWORD=$password" >> $env:GITHUB_ENV
          "COQUI_ACCESS_TEST_SYSTEM_GROUP=coquitestgroup" >> $env:GITHUB_ENV
      - name: Sign in (Windows)
        if: runner.os == 'Windows'
        run: cargo test -p coqui-access-system --test real_login -- --include-ignored
      - name: Make a throwaway account (Linux)
        if: runner.os == 'Linux'
        run: |
          password="Cq1!$(openssl rand -hex 16)"
          echo "::add-mask::$password"
          sudo groupadd coquitestgroup
          sudo useradd -M -G coquitestgroup coquitest
          echo "coquitest:$password" | sudo chpasswd
          printf '@include common-auth\n@include common-account\n' | sudo tee /etc/pam.d/coqui-access >/dev/null
          {
            echo "COQUI_ACCESS_TEST_SYSTEM_USER=coquitest"
            echo "COQUI_ACCESS_TEST_SYSTEM_PASSWORD=$password"
            echo "COQUI_ACCESS_TEST_SYSTEM_GROUP=coquitestgroup"
          } >> "$GITHUB_ENV"
      # pam_unix checks another account's password only as root, so the built test runs under sudo.
      - name: Sign in (Linux)
        if: runner.os == 'Linux'
        run: |
          binary="$(cargo test -p coqui-access-system --test real_login --no-run --message-format=json \
            | jq -r 'select(.profile.test == true and .target.name == "real_login") | .executable')"
          sudo --preserve-env=COQUI_ACCESS_TEST_SYSTEM_USER,COQUI_ACCESS_TEST_SYSTEM_PASSWORD,COQUI_ACCESS_TEST_SYSTEM_GROUP \
            "$binary" --include-ignored
      - name: Remove the throwaway account (Windows)
        if: always() && runner.os == 'Windows'
        shell: powershell
        run: |
          Remove-LocalUser -Name coquitest -ErrorAction SilentlyContinue
          Remove-LocalGroup -Name coquitestgroup -ErrorAction SilentlyContinue
      - name: Remove the throwaway account (Linux)
        if: always() && runner.os == 'Linux'
        run: |
          sudo userdel coquitest || true
          sudo groupdel coquitestgroup || true
          sudo rm -f /etc/pam.d/coqui-access
