[workspace]
resolver = "3"
members = [
    "crates/*",
    "providers/access/*",
    "providers/access/*/plugin",
    "crates/coqui-roles/plugin",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MPL-2.0"
repository = "https://github.com/Boriken-Dev/coqui-access"
publish = false

[workspace.dependencies]
coqui-access = { path = "crates/coqui-access" }
coqui-access-kit = { path = "crates/coqui-access-kit" }
coqui-access-plugin-support = { path = "providers/access/plugin-support" }
coqui-peer-tls = "=0.0.0-alpha.0"
coqui-roles = { path = "crates/coqui-roles" }

# guatiao main, pinned until a release carries what these crates use.
guatiao = { git = "https://github.com/Boriken-Dev/guatiao", rev = "a67fd4be0aa319795614ac6fe12d35d856ec3d8b" }
# No format by default: the kit names none, and each plugin brings its own.
guatiao-serde = { git = "https://github.com/Boriken-Dev/guatiao", rev = "a67fd4be0aa319795614ac6fe12d35d856ec3d8b", default-features = false }

serde = { version = "1", default-features = false, features = ["derive", "std"] }
toml = "1"
serde_json = "1"
sha2 = { version = "0.11.1", default-features = false }
subtle = "2.6"
getrandom = "0.3"
argon2 = "0.6"
ldap3 = { version = "0.12", default-features = false, features = ["sync", "tls-rustls-ring"] }
rustls = { version = "0.23", default-features = false, features = ["std", "ring"] }
tokio = { version = "1", default-features = false }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rcgen = "0.14"
x509-parser = "0.18"
globset = "0.4"
tempfile = "3"
