[workspace]
resolver = "3"
members = [
    "crates/*",
    "providers/access/*",
    "providers/access/*/plugin",
    "crates/coqui-roles/plugin",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MPL-2.0"
repository = "https://github.com/Boriken-Dev/coqui-access"
publish = false

[workspace.dependencies]
coqui-access = { path = "crates/coqui-access" }
coqui-access-kit = { path = "crates/coqui-access-kit" }
# Address and network lists, at the revision coqui-peer-tls depends on, so a build has one.
coqui-net-acl = { version = "0.0.0-alpha.0", git = "https://github.com/Boriken-Dev/coqui-net-acl", rev = "e0f31323bffeb6ff05c2c3e5c50a7d58e6aafd28" }
# The waiting queue's bounds, at the version coqui-peer-tls depends on.
coqui-peer = "=0.0.0-alpha.1"
coqui-peer-tls = "=0.0.0-alpha.1"
coqui-roles = { path = "crates/coqui-roles" }

# guatiao main, pinned until a release carries what these crates use.
guatiao = { git = "https://github.com/Boriken-Dev/guatiao", rev = "a67fd4be0aa319795614ac6fe12d35d856ec3d8b" }
# No format by default: the kit names none, and each plugin brings its own.
guatiao-serde = { git = "https://github.com/Boriken-Dev/guatiao", rev = "a67fd4be0aa319795614ac6fe12d35d856ec3d8b", default-features = false }

serde = { version = "1", default-features = false, features = ["derive", "std"] }
# The formats the plugins write their file tables in; no library crate names one.
toml = "1"
serde_json = "1"
sha2 = { version = "0.11.1", default-features = false }
subtle = "2.6"
# The same major as argon2's, so the kit adds no second copy.
getrandom = "0.4"
# Base64url and hex for generated secrets and digests.
data-encoding = "2.11"
argon2 = "0.6"
ldap3 = { version = "0.12", default-features = false, features = ["sync", "tls-rustls-ring"] }
rustls = { version = "0.23", default-features = false, features = ["std", "ring"] }
tokio = { version = "1", default-features = false }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rcgen = "0.14"
x509-parser = "0.18"
globset = "0.4"
# The caches in front of directories and authorizers: TTL per entry, bounded, no thread.
moka = { version = "0.12", default-features = false, features = ["sync"] }
tempfile = "3"
# coqui-access-system: Unix accounts and groups through NSS (getpwnam, getgrouplist).
uzers = { version = "0.12.2", default-features = false }
# coqui-access-system: PAM conversations. Pre-1.0, chosen because it binds Linux-PAM,
# OpenPAM (FreeBSD, macOS) and Sun PAM alike; `link` links the system libpam.
nonstick = { version = "0.1.2", default-features = false, features = ["link"] }
# coqui-access-system: LogonUserW, the NetUser API and SID text on Windows.
windows-sys = { version = "0.61", default-features = false, features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_NetManagement",
    "Win32_Security",
    "Win32_Security_Authorization",
] }
